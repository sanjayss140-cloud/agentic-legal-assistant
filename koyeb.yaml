name: agentic-legal-assistant
services:
  - name: web
    type: web
    docker:
      dockerfile: Dockerfile
    regions:
      - fra
      - was
    instance_type: free
    routes:
      - path: /
        port: 8000
    health_checks:
      - path: /health
        port: 8000
        interval: 30
        timeout: 5
